<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#343D27" />
    <!-- Primary SEO & Open Graph Meta Tags for WhatsApp, iMessage, and Social Previews -->
    <meta name="description" content="You are cordially invited to celebrate the wedding ceremony of Nisma Ayisha & Mohammed Rashid. Sunday, 13 December 2026 at Sagar Auditorium, Panemangalore." />

    <!-- Open Graph / WhatsApp / Facebook / iMessage -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nisma-rashid-wedding.vercel.app/" />
    <meta property="og:site_name" content="Nisma & Rashid Wedding" />
    <meta property="og:title" content="Nisma Ayisha & Mohammed Rashid — Wedding Invitation" />
    <meta property="og:description" content="You are cordially invited to celebrate the wedding ceremony of Nisma Ayisha & Mohammed Rashid. Sunday, 13 December 2026." />
    
    <!-- Primary Preview Image (Absolute URL required by WhatsApp) -->
    <meta property="og:image" content="https://nisma-rashid-wedding.vercel.app/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://nisma-rashid-wedding.vercel.app/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="640" />
    <meta property="og:image:alt" content="The Wedding of Nisma Ayisha & Mohammed Rashid" />
    <link rel="image_src" href="https://nisma-rashid-wedding.vercel.app/og-image.jpg" />
    <meta itemprop="image" content="https://nisma-rashid-wedding.vercel.app/og-image.jpg" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nisma Ayisha & Mohammed Rashid — Wedding Invitation" />
    <meta name="twitter:description" content="You are cordially invited to celebrate the wedding ceremony of Nisma Ayisha & Mohammed Rashid. Sunday, 13 December 2026." />
    <meta name="twitter:image" content="https://nisma-rashid-wedding.vercel.app/og-image.jpg" />

    <title>The Wedding of Nisma Ayisha & Mohammed Rashid</title>

    <!-- Google Fonts: Cormorant Garamond, Cinzel, Amiri, Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <script>
      // Immediate cache-busting for browser tab favicon
      try {
        const link = document.querySelector("link[rel*='icon']");
        if (link) link.href = '/favicon.svg?t=' + Date.now();
      } catch (e) {}
    </script>
  </head>
  <body class="bg-olive-800 text-ivory antialiased selection:bg-gold/30 selection:text-ivory overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
