<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" width="100%" height="100%">
  <defs>
    <!-- Ultra-Luxe Polished Champagne Gold Gradient -->
    <linearGradient id="goldLuxe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9DE"/>
      <stop offset="25%" stop-color="#F5D77F"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="75%" stop-color="#AA8214"/>
      <stop offset="100%" stop-color="#E8CF7A"/>
    </linearGradient>

    <!-- Crisp Luminous Frost Silver Gradient -->
    <linearGradient id="frostSilver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F8FAFC"/>
      <stop offset="80%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Subtle Hairline Contrast Drop Shadow for Tab Clarity -->
    <filter id="crispDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 100% Transparent Background - Thin Luxury Monogram N&R -->
  <g filter="url(#crispDepth)" stroke-linecap="round" stroke-linejoin="round">

    <!-- LETTER "N" in Slender Frost Silver -->
    <g stroke="url(#frostSilver)" fill="none">
      <!-- Left Vertical Stem -->
      <line x1="44" y1="34" x2="44" y2="106" stroke-width="2.4"/>
      <!-- Top Left Serif -->
      <line x1="33" y1="34" x2="55" y2="34" stroke-width="1.6"/>
      <!-- Bottom Left Serif -->
      <line x1="33" y1="106" x2="55" y2="106" stroke-width="1.6"/>

      <!-- Diagonal Stroke (Thin, high-fashion taper) -->
      <line x1="44" y1="34" x2="98" y2="106" stroke-width="3.2"/>

      <!-- Right Vertical Stem -->
      <line x1="98" y1="34" x2="98" y2="106" stroke-width="2.4"/>
      <!-- Top Right Serif -->
      <line x1="88" y1="34" x2="108" y2="34" stroke-width="1.6"/>
      <!-- Bottom Right Serif -->
      <line x1="88" y1="106" x2="108" y2="106" stroke-width="1.6"/>
    </g>

    <!-- AMPERSAND "&" in Slender Romantic Royal Gold -->
    <g stroke="url(#goldLuxe)" fill="none">
      <path d="M 131,64
               C 131,52 121,40 112,40
               C 103,40 96,49 96,60
               C 96,73 108,82 124,94
               C 129,98 135,103 133,109
               C 130,115 119,116 110,111
               C 100,105 98,95 98,88
               M 124,94
               L 142,108"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"/>
      <!-- Delicate gold accent finial dot -->
      <circle cx="143" cy="108" r="1.5" fill="url(#goldLuxe)" stroke="none"/>
    </g>

    <!-- LETTER "R" in Slender Frost Silver -->
    <g stroke="url(#frostSilver)" fill="none">
      <!-- Left Vertical Stem -->
      <line x1="144" y1="34" x2="144" y2="106" stroke-width="2.4"/>
      <!-- Top Left Serif -->
      <line x1="133" y1="34" x2="155" y2="34" stroke-width="1.6"/>
      <!-- Bottom Left Serif -->
      <line x1="133" y1="106" x2="155" y2="106" stroke-width="1.6"/>

      <!-- Upper Delicate Circular Bowl -->
      <path d="M 144,34
               L 174,34
               C 192,34 198,46 198,56
               C 198,68 188,74 172,74
               L 144,74"
            stroke-width="2.4"/>

      <!-- Graceful Diagonal Leg with Subtle Classical Terminal -->
      <path d="M 166,74
               C 174,78 182,92 196,106"
            stroke-width="2.8"/>
      <!-- Bottom Right Leg Serif -->
      <line x1="188" y1="106" x2="204" y2="106" stroke-width="1.6"/>
    </g>
  </g>
</svg>
