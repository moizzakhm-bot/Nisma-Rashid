<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OG Preview Card - Frost Silver Dark Green Vignette</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background-color: #010603;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #F8FAFC;
    }
    .og-container {
      width: 1200px;
      height: 630px;
      position: relative;
      /* Deep Dark Green with seamless radial vignette transition */
      background: radial-gradient(ellipse at 50% 48%, #07381d 0%, #042513 45%, #02150a 75%, #010804 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      text-align: center;
    }

    /* Subtle architectural arch watermark texture */
    .bg-texture {
      position: absolute;
      inset: 0;
      background-image: url('./bg-emerald.jpg');
      background-size: cover;
      background-position: center;
      opacity: 0.28;
      mix-blend-mode: screen;
      pointer-events: none;
    }

    /* Dramatic Cinematic Vignette Layer */
    .vignette-layer {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 50%, transparent 30%, rgba(1, 10, 5, 0.45) 60%, rgba(0, 4, 2, 0.88) 85%, #000000 100%);
      pointer-events: none;
    }

    /* Ambient Floating Frost Starlight Particles */
    .starlight {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }
    .star-1 { width: 3.5px; height: 3.5px; background: #FFFFFF; top: 110px; left: 190px; opacity: 0.55; box-shadow: 0 0 10px rgba(255, 255, 255, 0.7); }
    .star-2 { width: 2.5px; height: 2.5px; background: #E2E8F0; top: 190px; left: 270px; opacity: 0.45; box-shadow: 0 0 8px #FFF; }
    .star-3 { width: 4.5px; height: 4.5px; background: #FFFFFF; top: 130px; right: 210px; opacity: 0.6; box-shadow: 0 0 12px rgba(255, 255, 255, 0.8); }
    .star-4 { width: 3px; height: 3px; background: #E2E8F0; top: 500px; left: 230px; opacity: 0.45; box-shadow: 0 0 8px #FFF; }
    .star-5 { width: 3.5px; height: 3.5px; background: #FFFFFF; top: 470px; right: 250px; opacity: 0.5; box-shadow: 0 0 10px rgba(255, 255, 255, 0.7); }
    .star-6 { width: 2.5px; height: 2.5px; background: #E2E8F0; top: 310px; right: 170px; opacity: 0.4; }

    /* Central Content Box - Strictly 680px for perfect WhatsApp Web square-crop */
    .content-box {
      width: 680px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 10;
    }

    /* Bismillah Calligraphy */
    .bismillah {
      font-family: 'Amiri', serif;
      font-size: 44px;
      color: #FAF5E8;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
      text-shadow: 
        0 0 30px rgba(250, 245, 232, 0.5),
        0 3px 12px rgba(0, 0, 0, 0.9);
      line-height: 1.15;
    }

    .sub-blessing {
      font-family: 'Cormorant Garamond', 'Palatino Linotype', serif;
      font-style: italic;
      font-size: 20px;
      color: rgba(245, 240, 225, 0.92);
      font-weight: 300;
      letter-spacing: 0.06em;
      margin-bottom: 3px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    }
    .families {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 10.5px;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: #A3BFB0;
      margin-bottom: 18px;
      font-weight: 500;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
    }

    /* Frost Silver Divider */
    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 260px;
      margin: 0 auto 18px;
      opacity: 0.85;
    }
    .divider-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(226, 232, 240, 0.7));
    }
    .divider-line.right {
      background: linear-gradient(270deg, transparent, rgba(226, 232, 240, 0.7));
    }
    .divider-center {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0 12px;
    }
    .dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(226, 232, 240, 0.8);
      box-shadow: 0 0 4px rgba(255, 255, 255, 0.6);
    }
    .divider-diamond {
      width: 8px;
      height: 8px;
      border: 1px solid rgba(248, 250, 252, 0.8);
      background: #092e18;
      transform: rotate(45deg);
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
    }

    /* Stately Couple Names in Frost Silver */
    .couple-names {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 16px;
    }
    .name {
      font-family: 'Cormorant Garamond', 'Palatino Linotype', 'Georgia', serif;
      font-size: 74px;
      font-weight: 500;
      letter-spacing: 0.035em;
      line-height: 1.05;
      background: linear-gradient(180deg, #FFFFFF 0%, #F4F7F5 55%, #DCE6E0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 22px rgba(255, 255, 255, 0.45)) drop-shadow(0 4px 14px rgba(0, 0, 0, 0.95));
    }
    .ampersand {
      font-family: 'Cormorant Garamond', 'Palatino Linotype', serif;
      font-style: italic;
      font-size: 38px;
      margin: -2px 0;
      color: rgba(226, 232, 240, 0.85);
      text-shadow: 0 0 16px rgba(255, 255, 255, 0.4);
    }

    /* Celebration & Details */
    .details {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .celebration {
      font-family: 'Cormorant Garamond', 'Palatino Linotype', serif;
      font-style: italic;
      font-size: 22px;
      color: rgba(245, 240, 225, 0.95);
      letter-spacing: 0.08em;
      margin-bottom: 12px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    }

    /* Frost Silver Date Badge */
    .date-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 24px;
      border: 1px solid rgba(226, 232, 240, 0.32);
      border-radius: 9999px;
      background: rgba(4, 26, 13, 0.65);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.7), inset 0 0 10px rgba(255, 255, 255, 0.08);
      margin-bottom: 8px;
    }
    .date-text {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 13px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #F8FAFC;
      font-weight: 600;
    }

    .venue {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 11.5px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #B2CEBF;
      font-weight: 500;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
    }
  </style>
</head>
<body>
  <div class="og-container">
    <div class="bg-texture"></div>
    <div class="vignette-layer"></div>

    <!-- Ambient Floating Frost Stars -->
    <div class="starlight star-1"></div>
    <div class="starlight star-2"></div>
    <div class="starlight star-3"></div>
    <div class="starlight star-4"></div>
    <div class="starlight star-5"></div>
    <div class="starlight star-6"></div>

    <!-- Central Content Box (Zero borders, zero gold, pure frost silver) -->
    <div class="content-box">
      <!-- Bismillah Arabic Calligraphy -->
      <div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
      <div class="sub-blessing">With the Blessings of the Almighty</div>
      <div class="families">TOGETHER WITH THEIR FAMILIES</div>

      <!-- Frost Silver Divider -->
      <div class="divider">
        <div class="divider-line"></div>
        <div class="divider-center">
          <div class="dot"></div>
          <div class="divider-diamond"></div>
          <div class="dot"></div>
        </div>
        <div class="divider-line right"></div>
      </div>

      <!-- Stately Couple Names -->
      <div class="couple-names">
        <div class="name">Nisma Ayisha</div>
        <div class="ampersand">&amp;</div>
        <div class="name">Mohammed Rashid</div>
      </div>

      <!-- Event Details & Frost Silver Date Badge -->
      <div class="details">
        <div class="celebration">A Celebration of Nikah</div>
        <div class="date-badge">
          <span class="date-text">SUNDAY, 13 DECEMBER 2026</span>
        </div>
        <div class="venue">SAGAR AUDITORIUM • PANEMANGALORE</div>
      </div>
    </div>
  </div>
</body>
</html>
