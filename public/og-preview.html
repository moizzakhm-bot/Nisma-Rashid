<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OG Image Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background-color: #030d06;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #E2E8F0;
    }
    .og-container {
      width: 1200px;
      height: 630px;
      position: relative;
      background: radial-gradient(ellipse at 50% 35%, #082917 0%, #031409 60%, #010603 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      text-align: center;
    }
    /* Outer Concentric Hairline Frame */
    .outer-frame {
      position: absolute;
      inset: 24px;
      border: 1px solid rgba(226, 232, 240, 0.35);
      border-radius: 24px;
      pointer-events: none;
    }
    /* Inner Concentric Hairline Frame */
    .inner-frame {
      position: absolute;
      inset: 34px;
      border: 1px solid rgba(226, 232, 240, 0.16);
      border-radius: 16px;
      pointer-events: none;
    }
    /* Corner Diamond Accents */
    .corner-diamond {
      position: absolute;
      width: 8px;
      height: 8px;
      border: 1px solid rgba(245, 215, 127, 0.6);
      transform: rotate(45deg);
      background: #082917;
    }
    .top-left { top: 30px; left: 30px; }
    .top-right { top: 30px; right: 30px; }
    .bottom-left { bottom: 30px; left: 30px; }
    .bottom-right { bottom: 30px; right: 30px; }

    .bismillah {
      font-family: 'Amiri', serif;
      font-size: 40px;
      color: #F8FAFC;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.35);
    }
    .sub-blessing {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 20px;
      color: rgba(226, 232, 240, 0.85);
      font-weight: 300;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }
    .families {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 11px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #94A3B8;
      margin-bottom: 22px;
    }
    /* Diamond Divider */
    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 240px;
      margin: 0 auto 24px;
      opacity: 0.75;
    }
    .divider-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(226, 232, 240, 0.4));
    }
    .divider-line.right {
      background: linear-gradient(270deg, transparent, rgba(226, 232, 240, 0.4));
    }
    .divider-diamond {
      width: 7px;
      height: 7px;
      border: 1px solid rgba(226, 232, 240, 0.5);
      background: #082213;
      transform: rotate(45deg);
      margin: 0 12px;
    }
    /* Couple Names */
    .couple-names {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
    }
    .name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 64px;
      font-weight: 500;
      color: #F8FAFC;
      letter-spacing: 0.04em;
      line-height: 1.1;
      text-shadow: 0 0 25px rgba(226, 232, 240, 0.4), 0 0 50px rgba(255, 255, 255, 0.2);
    }
    .ampersand {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 38px;
      color: #E5BE53;
      margin: -2px 0;
      text-shadow: 0 0 15px rgba(229, 190, 83, 0.5);
    }
    .details {
      margin-top: 10px;
    }
    .celebration {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 20px;
      color: rgba(226, 232, 240, 0.9);
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }
    .date-venue {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 13px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #E2E8F0;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="og-container">
    <div class="outer-frame"></div>
    <div class="inner-frame"></div>
    <div class="corner-diamond top-left"></div>
    <div class="corner-diamond top-right"></div>
    <div class="corner-diamond bottom-left"></div>
    <div class="corner-diamond bottom-right"></div>

    <div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
    <div class="sub-blessing">With the Blessings of the Almighty</div>
    <div class="families">TOGETHER WITH THEIR FAMILIES</div>

    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-diamond"></div>
      <div class="divider-line right"></div>
    </div>

    <div class="couple-names">
      <div class="name">Nisma Ayisha</div>
      <div class="ampersand">&amp;</div>
      <div class="name">Mohammed Rashid</div>
    </div>

    <div class="details">
      <div class="celebration">A Celebration of Nikah</div>
      <div class="date-venue">SUNDAY 13 DECEMBER 2026 • SAGAR AUDITORIUM, PANEMANGALORE</div>
    </div>
  </div>
</body>
</html>
